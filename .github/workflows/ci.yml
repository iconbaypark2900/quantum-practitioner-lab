name: CI

on:
  push:
  pull_request:

jobs:
  # The package must stay importable and testable without the optional quantum
  # stack, so this job deliberately installs only the core dependencies. The
  # quantum tutorials skip themselves here.
  core:
    name: core (no quantum stack)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: scaffolds still run without qiskit
        run: python scripts/run_benchmarks.py

  # The real coverage: exercises the actual VQE, QAOA, and quantum-kernel paths.
  quantum:
    name: quantum (qiskit + nature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,qiskit,nature]"
      - run: pytest -q
      - name: generate tutorial artifacts
        run: python scripts/run_first_three_tutorial_outputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-outputs
          path: results/
