# The source of truth for source papers.
#
# DECISIONS.md #6 makes source papers project assets. This file is the one place
# they are maintained by hand: `papers/index.json` is GENERATED from it by
# `scripts/generate_paper_index.py`, and `qprac_lab.papers.registry` reads it
# rather than keeping its own copy. Before that, the same paper lived in five
# places and nothing compared them, so two of them drifted out of the
# machine-readable stores entirely.
#
# `tests/test_paper_citations.py` enforces the invariants: the generated index
# must match, every paper cited in prose must resolve here, and every identifier
# present must be well formed.
#
# Every doi/arxiv/url below was checked to resolve to a document whose title
# matches the entry, on 2026-08-30. An identifier that does not resolve is worse
# than a missing one: it looks like traceability and is not. Verify before adding.

