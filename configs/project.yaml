# `version` is checked against pyproject.toml by tests/test_configs.py.
project:
  name: quantum-practitioner-lab
  package: qprac_lab
  cli: qprac-lab
  version: 0.3.0
  default_backend: statevector
  random_seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  papers: papers
  notebooks: notebooks
  tutorials: tutorials
  configs: configs

extras:
  qiskit: Required by every quantum tutorial.
  nature: PySCF-backed molecular Hamiltonians at arbitrary bond lengths.
  pennylane: Independent cross-check of the Qiskit results.
  xgboost: Extra classical baseline for the QML tutorials.
  dev: pytest, ruff, mypy.
