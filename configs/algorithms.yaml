# Implementation status per algorithm. Cross-checked against
# qprac_lab.demo_registry by tests/test_configs.py: anything marked `quantum`
# here must be in QUANTUM_DEMOS, and vice versa.
simulation:
  vqe_molecular_energy:
    status: quantum
    algorithm_type: hybrid_variational_eigensolver
    use_case: materials_discovery_refinement
    baseline: [exact_diagonalization, hartree_fock]
  adapt_vqe_materials:
    status: quantum
    algorithm_type: adaptive_variational_eigensolver
    use_case: materials_discovery_refinement
    baseline: [exact_diagonalization, hartree_fock, fixed_ansatz_vqe]
  trotterization:
    status: quantum
    algorithm_type: product_formula_hamiltonian_simulation
    use_case: quantum_many_body_dynamics
    baseline: [exact_matrix_exponential]

optimization:
  qaoa_portfolio_selection:
    status: quantum
    algorithm_type: hybrid_combinatorial_optimization
    use_case: quantum_hybrid_portfolio_optimizer
    baseline: [brute_force, greedy, simulated_annealing, uniform_feasible_sampling]
  qaoa_maxcut:
    status: quantum
    algorithm_type: hybrid_combinatorial_optimization
    use_case: graph_partitioning_and_network_clustering
    baseline: [brute_force, greedy, random_assignment]
  logistics_routing_qubo:
    status: scaffold
    algorithm_type: constrained_routing_qubo
    note: Not implemented; the QUBO builder and QAOA loop are both reusable.

pdes:
  hhl_intro:
    status: quantum
    algorithm_type: quantum_linear_systems_algorithm
    use_case: quantum_linear_systems_for_pdes
    baseline: [numpy_linalg_solve]
  variational_heat_equation:
    status: quantum
    algorithm_type: variational_pde_residual_minimization
    use_case: thermal_diffusion_simulation
    baseline: [implicit_euler_direct_solve]
  black_scholes_pde:
    status: quantum
    algorithm_type: variational_pde_residual_minimization
    use_case: financial_derivatives_pricing
    baseline: [black_scholes_closed_form, implicit_finite_difference]

qml:
  quantum_kernel_biomedical:
    status: quantum
    algorithm_type: kernel_method_qsvc
    use_case: biomedical_kg_link_prediction
    baseline: [rbf_svm, random_forest, xgboost]
  vqc_classifier:
    status: quantum
    algorithm_type: variational_quantum_classifier
    use_case: biomedical_kg_link_prediction
    baseline: [quantum_kernel_svm, rbf_svm, random_forest]
